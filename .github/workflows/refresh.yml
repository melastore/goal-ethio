name: Refresh fixtures

on:
  schedule:
    # 04:00 UTC is 07:00 in Addis, so the night's results are in before anyone
    # opens the site.
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # football-data.org allows ten calls a minute, so a full run takes a few
      # minutes; yesterday's responses are reused where they still hold.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: football-data-${{ github.run_id }}
          restore-keys: football-data-

      - run: npm run fetch:week
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}

      - name: Commit the week
        run: |
          git config user.name melastore
          git config user.email ${{ secrets.GIT_EMAIL || 'melastore@users.noreply.github.com' }}
          git add src/data/week.json
          git diff --staged --quiet || git commit -m "refresh fixtures"
          git push
