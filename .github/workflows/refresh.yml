name: Refresh fixtures

on:
  schedule:
    # Match days, so results and live matches land frequently.
    - cron: "*/30 * * * 6,0"
    # Midweek there is little to move, so four checks a day is plenty.
    - cron: "0 */6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # No response cache between runs: a run exists to pick up scores that
      # changed since the last one. football-data.org allows ten calls a
      # minute and the run is two per competition, so it costs a few minutes.
      - run: npm run fetch:week
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          CACHE_TTL_MINUTES: 0

      # The fetch only carries ten matches a side and the next run overwrites
      # them. This keeps every match it has ever pulled, which is what the
      # ratings need to be worth anything.
      - run: npm run archive

      - name: Commit the week
        id: commit
        run: |
          git config user.name melastore
          git config user.email ${{ secrets.GIT_EMAIL || 'melastore@users.noreply.github.com' }}
          git add src/data/week.json src/data/history.json
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "refresh fixtures"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

  # A push made with GITHUB_TOKEN raises no push event, so Deploy has to be
  # called rather than waited on.
  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.refresh.outputs.sha }}
