name: Refresh fixtures

on:
  schedule:
    # 04:00 UTC is 07:00 in Addis, so the night's results are in before anyone
    # opens the site.
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # api-football allows 100 calls a day on the free tier and a full run costs
      # about sixty, so yesterday's responses are reused where they still hold.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: api-football-${{ github.run_id }}
          restore-keys: api-football-

      - run: npm run fetch:week
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}

      - name: Commit the week
        run: |
          git config user.name melastore
          git config user.email ${{ secrets.GIT_EMAIL || 'melastore@users.noreply.github.com' }}
          git add src/data/week.json
          git diff --staged --quiet || git commit -m "refresh fixtures"
          git push
