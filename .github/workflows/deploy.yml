name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Refresh calls this once it has committed a new week.json.
  workflow_call:
    inputs:
      ref:
        # A called workflow checks out the caller's starting commit, which is
        # the one before the refresh, so the new commit has to be named.
        type: string
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # A project site is served from /<repo>, and Next bakes the prefix in
          # at build time.
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          # Set the LIVE_URL repo variable to the deployed worker (see
          # worker/README.md) for scores in seconds. Unset, the site falls back
          # to feed.json and moves only when this workflow runs.
          NEXT_PUBLIC_LIVE_URL: ${{ vars.LIVE_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
